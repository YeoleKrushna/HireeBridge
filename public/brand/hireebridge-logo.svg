<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526" />
      <stop offset="100%" stop-color="#0B1F36" />
    </linearGradient>
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F36" />
      <stop offset="100%" stop-color="#0d6e6e" />
    </linearGradient>
    <linearGradient id="bridgeGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0B1F36" />
      <stop offset="50%" stop-color="#0d6e6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <g>
    <!-- Left Pillar of H -->
    <rect x="76" y="76" width="104" height="360" rx="20" fill="url(#navyPillar)" />

    <!-- Right Pillar of H -->
    <rect x="332" y="76" width="104" height="360" rx="20" fill="url(#rightPillar)" />

    <!-- Connecting Arch Bridge forming H -->
    <path d="M 180 220 C 215 270, 297 270, 332 220 L 332 295 C 297 345, 215 345, 180 295 Z" fill="url(#bridgeGradient)" />
  </g>
</svg>