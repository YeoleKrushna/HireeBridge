<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyanPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="rightPillarLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="bridgeGradientLight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <g>
    <!-- Left Pillar of H in luminous cyan -->
    <path d="M 80 80 L 175 80 L 175 432 L 80 432 Z" fill="url(#cyanPillar)" rx="10" />

    <!-- Right Pillar of H in vibrant mint-teal -->
    <path d="M 337 80 L 432 80 L 432 432 L 337 432 Z" fill="url(#rightPillarLight)" rx="10" />

    <!-- Connecting Arch Bridge in luminous cyan-teal -->
    <path d="M 175 220 
             C 210 270, 302 270, 337 220 
             L 337 295 
             C 302 345, 210 345, 175 295 
             Z" fill="url(#bridgeGradientLight)" />
  </g>
</svg>
