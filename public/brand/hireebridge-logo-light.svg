<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyanPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="rightPillarLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="bridgeGradientLight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <g>
    <!-- Left Pillar of H in luminous cyan -->
    <rect x="76" y="76" width="104" height="360" rx="20" fill="url(#cyanPillar)" />

    <!-- Right Pillar of H in vibrant mint-teal -->
    <rect x="332" y="76" width="104" height="360" rx="20" fill="url(#rightPillarLight)" />

    <!-- Connecting Arch Bridge in luminous cyan-teal -->
    <path d="M 180 220 C 215 270, 297 270, 332 220 L 332 295 C 297 345, 215 345, 180 295 Z" fill="url(#bridgeGradientLight)" />
  </g>
</svg>
