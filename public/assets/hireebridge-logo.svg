<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526" />
      <stop offset="100%" stop-color="#0B1F36" />
    </linearGradient>
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F36" />
      <stop offset="100%" stop-color="#0d6e6e" />
    </linearGradient>
    <linearGradient id="bridgeGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0B1F36" />
      <stop offset="50%" stop-color="#0d6e6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1F36" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Left Pillar of H -->
    <path d="M 80 80 L 175 80 L 175 432 L 80 432 Z" fill="url(#navyPillar)" rx="10" />

    <!-- Right Pillar of H -->
    <path d="M 337 80 L 432 80 L 432 432 L 337 432 Z" fill="url(#rightPillar)" rx="10" />

    <!-- Connecting Arch Bridge forming H -->
    <!-- The bridge connects the two pillars and curves upwards gracefully like a suspension bridge -->
    <path d="M 175 220 
             C 210 270, 302 270, 337 220 
             L 337 295 
             C 302 345, 210 345, 175 295 
             Z" fill="url(#bridgeGradient)" />
  </g>
</svg>